name = "pulse-ai"
main = "worker.js"
compatibility_date = "2026-06-01"

[vars]
# Your GitHub Pages address, e.g. "https://yourname.github.io". "*" allows any site to call the relay.
ALLOWED_ORIGIN = "*"
MODEL = "claude-sonnet-5-5"
QUICK_MODEL = "claude-haiku-5-5"
DAILY_LIMIT = "40"

# Secrets (never put these in this file):
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT   (paste the whole service-account JSON)
