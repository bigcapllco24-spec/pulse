name: Tests
# Every push: the quick checks and the demo-mode browser tests (scripts/check.sh), then the real-database tests
# (tests/live.py): the app against the Firebase emulators with firestore.rules, on WebKit (iPhone) and Chromium
# (Android, slow connection), and the data jobs scoring calls against the same database.
on:
  push:
    branches-ignore: [main]   # on main, the deploy runs these first (workflow_call) and publishes only if they pass
  workflow_call:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Runners pinned to 24.04: Playwright 1.56 installs Ubuntu 24 packages (ubuntu-latest moves to 26 from 19 Oct 2026).
      # The browsers are cached, so most runs skip the download.
      - uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: "pw-1.56.0-${{ runner.os }}-chromium" }
      - run: bash scripts/install-browsers.sh chromium
      - run: bash scripts/check.sh
        env: { PW_CHROMIUM: "" }

  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Runners pinned to 24.04: Playwright 1.56 installs Ubuntu 24 packages (ubuntu-latest moves to 26 from 19 Oct 2026).
      # The browsers are cached, so most runs skip the download.
      - uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: "pw-1.56.0-${{ runner.os }}-chromium-webkit" }
      - run: bash scripts/install-browsers.sh chromium webkit
      - name: Real-database tests (Firebase emulators)
        run: npx -y firebase-tools@13.29.1 emulators:exec --project demo-pulse --only auth,firestore "python3 tests/live.py -v"
