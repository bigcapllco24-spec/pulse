name: Tests
# Every push: the quick checks and the demo-mode browser tests (scripts/check.sh), then the real-database tests
# (tests/live.py): the app against the Firebase emulators with firestore.rules, on WebKit (iPhone) and Chromium
# (Android, slow connection), and the data jobs scoring calls against the same database.
on:
  push:
    branches-ignore: [main]   # on main, the deploy runs these first (workflow_call) and publishes only if they pass
  workflow_call:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # the browser download sometimes stalls until the job times out: give each try 5 minutes, up to 3 tries
      - run: |
          pip install playwright==1.56.0
          for i in 1 2 3; do timeout 300 python -m playwright install --with-deps chromium && exit 0; echo "install try $i stalled"; done; exit 1
      - run: bash scripts/check.sh
        env: { PW_CHROMIUM: "" }

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # the browser download sometimes stalls until the job times out: give each try 5 minutes, up to 3 tries
      - run: |
          pip install playwright==1.56.0
          for i in 1 2 3; do timeout 300 python -m playwright install --with-deps chromium webkit && exit 0; echo "install try $i stalled"; done; exit 1
      - name: Real-database tests (Firebase emulators)
        run: npx -y firebase-tools@13.29.1 emulators:exec --project demo-pulse --only auth,firestore "python3 tests/live.py -v"
