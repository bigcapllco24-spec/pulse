name: Data and deploy
# Two paths:
# - A code push publishes the app straight away (about a minute), reusing the prices and news already live.
# - Every 2 hours (or when run by hand) the data job refreshes coin candles and news, then publishes (no tests, no rules).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A code push publishes nothing unless every test passes, the real-database tests included (tests.yml).
  # The 2-hourly data runs don't change code, so they skip the tests.
  tests:
    if: github.event_name == 'push'
    uses: ./.github/workflows/tests.yml
  build:
    needs: tests
    if: always() && (needs.tests.result == 'success' || (needs.tests.result == 'skipped' && github.event_name != 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version: 22
      - name: Reuse the live prices and news (code push)
        if: github.event_name == 'push'
        run: |
          base="${SITE_URL:-https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}}"
          for f in candles.json news.json daily.json; do
            curl -fsS --max-time 20 "$base/data/$f" -o "/tmp/$f" && node -e "JSON.parse(require('fs').readFileSync('/tmp/$f'))" && mv "/tmp/$f" "web/data/$f" \
              || echo "Using the copy of $f in the repository"
          done
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Refresh data (coins, news) and check rules
        if: github.event_name != 'push'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node pipeline/run.mjs web/data
      # The database rules go live with the code that needs them (pipeline/deploy-rules.mjs publishes firestore.rules
      # only when they differ from the live ones; rules that don't compile stop the deploy here).
      - name: Publish the database rules
        if: github.event_name == 'push'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node pipeline/deploy-rules.mjs
      # The repository keeps readable code; the site gets the same code minified (about a third smaller to download
      # and parse). The modules stay separate files, so nothing else changes. Checked by tests/e2e.py on a minified copy.
      - name: Minify the app's code
        run: |
          npx -y esbuild@0.28.2 web/js/*.js --minify --outdir=web/js --allow-overwrite --log-level=warning
          npx -y esbuild@0.28.2 web/styles.css --minify --outfile=web/styles.css --allow-overwrite --log-level=warning
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    # always(): build's tests are skipped on scheduled and manual runs, and a skipped job upstream skips this one
    # otherwise (it did from 17 to 22 Oct: the data jobs ran but nothing was published)
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
